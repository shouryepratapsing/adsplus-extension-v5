<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0d0f14;color:#e8eaf0;margin:0;padding:16px;width:270px;font-size:14px}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:13px}.brand img{width:30px;height:30px;object-fit:contain}h1{font-size:15px;margin:0}.sub{font-size:11px;color:#9aa3b6;margin-top:2px}
label{display:flex;align-items:center;gap:9px;padding:10px 11px;background:#141822;border:1px solid #232838;border-radius:9px;margin-bottom:7px;cursor:pointer}label input{width:auto;margin:0}
button{width:100%;margin-top:7px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:650;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="brand"><img src="adsplus-logo.svg" alt="Ads+ logo"><div><h1>Ads+ Extension V5</h1><div class="sub">adsplusprof.me</div></div></div>
<label><input type="checkbox" id="enabled"> Extension ON</label>
<label><input type="checkbox" id="video"> Video mode</label>
<label><input type="checkbox" id="sticky"> Bottom card mode</label>
<button id="opts">Open full settings</button>
<script src="popup.js"></script>
</body>
</html>
