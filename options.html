<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ads+ Private Settings</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0d0f14;color:#e8eaf0;margin:0;padding:26px;line-height:1.55}.w{max-width:640px;margin:0 auto}.brand{display:flex;align-items:center;gap:11px;margin-bottom:18px}.brand img{width:40px;height:40px;object-fit:contain}h1{font-size:22px;margin:0 0 4px}.c{color:#9aa3b6;font-size:13.5px;margin:0 0 18px}label.sw{display:flex;align-items:center;gap:10px;background:#141822;border:1px solid #232838;border-radius:10px;padding:13px 15px;margin-bottom:9px;cursor:pointer;font-size:14px}label.sw input{width:auto;margin:0}button{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;border-radius:9px;padding:11px 20px;font-size:14px;font-weight:650;cursor:pointer}.st{color:#10b981;font-size:13px;margin-left:10px}
</style></head><body><div class="w"><div class="brand"><img src="adsplus-logo.svg" alt="Ads+ logo"><div><h1>Ads+ Extension V5</h1><div class="c" style="margin:0">Connected to Ads+ campaigns</div></div></div>
